name: AgilityShift PQC Scan

on:
  push:
  pull_request:

jobs:
  pqc-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AgilityShift
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run AgilityShift scan
        # This demo workflow intentionally fails when critical PQC migration breakage risks are found.
        run: |
          agilityshift scan ./examples/vulnerable-bank-api --report all --fail-on critical

      - name: Upload AgilityShift reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agilityshift-reports
          path: |
            agilityshift-report.html
            agilityshift-report.json
